name: Test Claude Code avec OAuth fictif
on:
  push:
    branches: [main]
    paths: [.github/workflows/test-claude-code-simule.yml]
permissions: {}
jobs:
  mock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Tester Claude Code sans réseau externe ni identifiant réel
        run: |
          set -eu
          cat > Dockerfile <<'DOCKER'
          FROM node:24-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends python3 && npm install -g @anthropic-ai/claude-code@2.1.311
          COPY mock.py /mock.py
          DOCKER
          cat > mock.py <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import threading
          from http.server import BaseHTTPRequestHandler, HTTPServer
          
          MODEL = "claude-haiku-4-5-20251001"
          PROMPT = (
              "Corrige uniquement la faute d’accord dans la phrase suivante. "
              "Renvoie uniquement la phrase corrigée, sans utiliser d’outil.\n\n"
              "Les documents fictifs est prêts."
          )
          ANSWER = "Les documents fictifs sont prêts."
          TOKEN = "jeton-fictif-sans-acces"
          requests_seen = []
          
          
          class MockAnthropic(BaseHTTPRequestHandler):
              def log_message(self, *_):
                  pass
          
              def do_POST(self):
                  if self.path.split("?", 1)[0] != "/v1/messages":
                      self.send_error(404)
                      return
                  if self.headers.get("Authorization") != f"Bearer {TOKEN}":
                      self.send_error(403)
                      return
                  size = int(self.headers.get("Content-Length", "0"))
                  if not 0 < size <= 100_000:
                      self.send_error(413)
                      return
                  data = json.loads(self.rfile.read(size))
                  if data.get("model") != MODEL or PROMPT not in json.dumps(
                      data.get("messages"), ensure_ascii=False
                  ).replace("\\n", "\n") or data.get("tools"):
                      self.send_error(403)
                      return
                  if requests_seen:
                      self.send_error(409)
                      return
                  requests_seen.append(True)
                  message = {
                      "id": "msg_mock", "type": "message", "role": "assistant",
                      "model": MODEL, "content": [], "stop_reason": None,
                      "stop_sequence": None, "usage": {"input_tokens": 42, "output_tokens": 0},
                  }
                  if data.get("stream"):
                      events = [
                          ("message_start", {"message": message}),
                          ("content_block_start", {"index": 0, "content_block": {"type": "text", "text": ""}}),
                          ("content_block_delta", {"index": 0, "delta": {"type": "text_delta", "text": ANSWER}}),
                          ("content_block_stop", {"index": 0}),
                          ("message_delta", {"delta": {"stop_reason": "end_turn", "stop_sequence": None},
                                             "usage": {"output_tokens": 8}}),
                          ("message_stop", {}),
                      ]
                      self.send_response(200)
                      self.send_header("Content-Type", "text/event-stream")
                      self.end_headers()
                      for name, fields in events:
                          self.wfile.write(f"event: {name}\ndata: {json.dumps({'type': name, **fields})}\n\n".encode())
                  else:
                      message["content"] = [{"type": "text", "text": ANSWER}]
                      message["stop_reason"] = "end_turn"
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.end_headers()
                      self.wfile.write(json.dumps(message).encode())
          
          
          def main():
              cli = os.environ.get("TEST_CLAUDE_BIN") or str(Path.home() / ".local/bin/claude")
              with tempfile.TemporaryDirectory(prefix="test-claude-fictif-") as temp:
                  with HTTPServer(("127.0.0.1", 0), MockAnthropic) as server:
                      thread = threading.Thread(target=server.serve_forever, daemon=True)
                      thread.start()
                      env = {
                          "PATH": "/usr/bin:/bin",
                          "HOME": temp,
                          "TMPDIR": temp,
                          "CLAUDE_CONFIG_DIR": temp,
                          "CLAUDE_CODE_OAUTH_TOKEN": TOKEN,
                          "ANTHROPIC_BASE_URL": f"http://127.0.0.1:{server.server_port}",
                          "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC": "1",
                          "DISABLE_AUTOUPDATER": "1",
                      }
                      try:
                          result = subprocess.run(
                              [cli, "-p", "--model", MODEL, "--max-turns", "1", "--tools", "",
                               "--strict-mcp-config", "--no-session-persistence", PROMPT],
                              cwd=temp, env=env, capture_output=True, text=True, timeout=45,
                          )
                          if result.returncode or len(requests_seen) != 1 or result.stdout.strip() != ANSWER:
                              raise SystemExit(f"ÉCHEC du test simulé (code {result.returncode}, requêtes acceptées {len(requests_seen)})")
                          print("TEST CLAUDE CODE SIMULÉ RÉUSSI")
                      finally:
                          server.shutdown()
          
          
          if __name__ == "__main__":
              main()
          PYTHON
          docker build -t claude-mock .
          docker run --rm --network none --cap-drop ALL --user 1000:1000 -e TEST_CLAUDE_BIN=/usr/local/bin/claude claude-mock python3 /mock.py
